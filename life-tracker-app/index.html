<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="生活工作台">
    <meta name="theme-color" content="#6C5CE7">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>生活工作台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 顶部标题栏 -->
        <header class="app-header">
            <h1>🌟 生活工作台</h1>
            <p class="subtitle">你的私人生活管理助手</p>
        </header>

        <!-- Tab 导航 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="weight">
                <span class="tab-icon">⚖️</span>
                <span class="tab-label">减肥</span>
            </button>
            <button class="tab-btn" data-tab="mood">
                <span class="tab-icon">😊</span>
                <span class="tab-label">心情</span>
            </button>
            <button class="tab-btn" data-tab="money">
                <span class="tab-icon">💰</span>
                <span class="tab-label">记账</span>
            </button>
            <button class="tab-btn" data-tab="dashboard">
                <span class="tab-icon">📊</span>
                <span class="tab-label">总览</span>
            </button>
        </nav>

        <!-- ============ 减肥记录模块 ============ -->
        <section id="weight-tab" class="tab-content active">
            <!-- 目标卡片 -->
            <div class="card goal-card">
                <div class="card-header">
                    <h2>🎯 减肥目标</h2>
                    <button class="btn-text" id="editWeightGoal">编辑</button>
                </div>
                <div class="goal-display" id="weightGoalDisplay">
                    <!-- JS 动态填充 -->
                </div>
                <div class="progress-bar-wrapper">
                    <div class="progress-bar" id="weightProgressBar"></div>
                </div>
                <p class="progress-text" id="weightProgressText"></p>
            </div>

            <!-- 添加记录表单 -->
            <div class="card">
                <div class="card-header">
                    <h2>📝 记录体重</h2>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>体重 (kg)</label>
                        <input type="number" id="weightInput" placeholder="如 65.5" step="0.1" min="0">
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="weightDateInput">
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="weightNoteInput" placeholder="今日感受..." rows="2"></textarea>
                </div>
                <button class="btn-primary" id="addWeightBtn">＋ 添加记录</button>
            </div>

            <!-- 体重趋势图 -->
            <div class="card">
                <div class="card-header">
                    <h2>📈 体重趋势</h2>
                </div>
                <canvas id="weightChart" height="200"></canvas>
            </div>

            <!-- 历史记录列表 -->
            <div class="card">
                <div class="card-header">
                    <h2>📋 历史记录</h2>
                    <button class="btn-text btn-danger" id="clearWeightBtn">清空</button>
                </div>
                <div id="weightList" class="record-list">
                    <!-- JS 动态填充 -->
                </div>
            </div>
        </section>

        <!-- ============ 心情记录模块 ============ -->
        <section id="mood-tab" class="tab-content">
            <!-- 今日心情快速选择 -->
            <div class="card">
                <div class="card-header">
                    <h2>😌 今天心情如何？</h2>
                </div>
                <div class="mood-selector">
                    <button class="mood-btn" data-mood="5" data-emoji="😄" data-label="超棒">😄</button>
                    <button class="mood-btn" data-mood="4" data-emoji="🙂" data-label="不错">🙂</button>
                    <button class="mood-btn" data-mood="3" data-emoji="😐" data-label="一般">😐</button>
                    <button class="mood-btn" data-mood="2" data-emoji="😕" data-label="不太好">😕</button>
                    <button class="mood-btn" data-mood="1" data-emoji="😢" data-label="很差">😢</button>
                </div>
                <div class="form-group" style="margin-top:16px">
                    <label>想记录些什么？</label>
                    <textarea id="moodNoteInput" placeholder="今天发生了什么..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="moodDateInput">
                </div>
                <button class="btn-primary" id="addMoodBtn">＋ 记录心情</button>
            </div>

            <!-- 心情统计 -->
            <div class="card">
                <div class="card-header">
                    <h2>📊 心情统计</h2>
                </div>
                <div id="moodStats" class="mood-stats">
                    <!-- JS 动态填充 -->
                </div>
                <canvas id="moodChart" height="180" style="margin-top:16px"></canvas>
            </div>

            <!-- 心情日历热力图 -->
            <div class="card">
                <div class="card-header">
                    <h2>🗓️ 心情日历</h2>
                </div>
                <div id="moodCalendar" class="mood-calendar">
                    <!-- JS 动态填充 -->
                </div>
            </div>

            <!-- 心情记录列表 -->
            <div class="card">
                <div class="card-header">
                    <h2>📋 心情日记</h2>
                </div>
                <div id="moodList" class="record-list">
                    <!-- JS 动态填充 -->
                </div>
            </div>
        </section>

        <!-- ============ 攒钱 + 花费记录模块 ============ -->
        <section id="money-tab" class="tab-content">
            <!-- 余额总览 -->
            <div class="card balance-card">
                <h2>💰 我的小金库</h2>
                <div class="balance-amount" id="balanceAmount">¥0.00</div>
                <div class="balance-detail">
                    <div class="balance-item">
                        <span class="balance-label">📥 总攒入</span>
                        <span class="balance-value income" id="totalIncome">¥0.00</span>
                    </div>
                    <div class="balance-divider"></div>
                    <div class="balance-item">
                        <span class="balance-label">📤 总支出</span>
                        <span class="balance-value expense" id="totalExpense">¥0.00</span>
                    </div>
                </div>
            </div>

            <!-- 添加记录 -->
            <div class="card">
                <div class="card-header">
                    <h2>📝 记一笔</h2>
                </div>
                <div class="money-type-toggle">
                    <button class="type-btn active" data-type="income">💰 攒钱</button>
                    <button class="type-btn" data-type="expense">💸 花费</button>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>金额 (¥)</label>
                        <input type="number" id="moneyAmount" placeholder="如 100.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="moneyDateInput">
                    </div>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <div class="category-grid" id="moneyCategoryGrid">
                        <!-- JS 动态填充 -->
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="moneyNoteInput" placeholder="选填，如：午餐、工资">
                </div>
                <button class="btn-primary" id="addMoneyBtn">＋ 添加记录</button>
            </div>

            <!-- 收支统计图 -->
            <div class="card">
                <div class="card-header">
                    <h2>📊 收支统计</h2>
                </div>
                <canvas id="moneyChart" height="200"></canvas>
            </div>

            <!-- 账单列表 -->
            <div class="card">
                <div class="card-header">
                    <h2>📋 账单明细</h2>
                    <button class="btn-text btn-danger" id="clearMoneyBtn">清空</button>
                </div>
                <div id="moneyList" class="record-list">
                    <!-- JS 动态填充 -->
                </div>
            </div>
        </section>

        <!-- ============ 总览仪表盘 ============ -->
        <section id="dashboard-tab" class="tab-content">
            <div class="card dashboard-card">
                <div class="card-header">
                    <h2>📊 生活总览</h2>
                </div>
                <div class="dashboard-grid" id="dashboardGrid">
                    <!-- JS 动态填充 -->
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="card">
                <div class="card-header">
                    <h2>⚙️ 数据管理</h2>
                </div>
                <button class="btn-secondary" id="exportDataBtn">📤 导出全部数据</button>
                <button class="btn-secondary" id="importDataBtn">📥 导入数据</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none">
                <button class="btn-secondary btn-danger-bg" id="clearAllBtn">🗑️ 清空所有数据</button>
            </div>

            <div class="card about-card">
                <h2>ℹ️ 关于</h2>
                <p>生活工作台 v1.0</p>
                <p class="muted">所有数据存储在本地，安全私密。</p>
            </div>
        </section>
    </div>

    <!-- 底部留白 -->
    <div style="height:100px"></div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- 确认弹窗 -->
    <div id="modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3 id="modalTitle">确认</h3>
            <p id="modalMessage"></p>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
